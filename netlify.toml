[build]
  command = "node scripts/check-dep-age.mjs package-lock.json && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Retired page.
[[redirects]]
  from = "/sdk/reference"
  to = "/sdk/v2/"
  status = 301
  force = true

[[redirects]]
  from = "/sdk/reference/*"
  to = "/sdk/v2/"
  status = 301
  force = true
